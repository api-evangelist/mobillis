name: Mobillis
description: >-
  Mobillis, operated by Reflex Mobility, Inc., is a fintech mobility platform
  that turns vehicle fleet inventory into a prepaid billing and access product.
  It sits as an overlay on top of legacy rental and fleet systems rather than
  replacing them, letting fleet operators collect payment upfront and reach new
  "everyday driver" segments, while non-fleet distribution partners resell
  vehicle access through referral links, a white-label front end, or the
  Mobillis Open APIs. The documented API surface covers wallet creation and
  management, PSP-orchestrated top-ups, ledger and transaction-history access,
  and webhook events for low-balance alerts and billing triggers. Mobillis
  operates from Johannesburg and New York.
